<!DOCTYPE html>
<html>
<head>
    <title>Payment Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        .payment-box {
            width: 350px;
            background: white;
            padding: 25px;
            margin: 50px auto;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }
        input,select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }
        button {
            width: 100%;
            padding: 12px;
            background: black;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: gray;
        }
          </style>
</head>
<body>
    <div class="payment-box">
        <h2>Checkout</h2>
        <h3>Product: CK Fashion Dress</h3>
        <p>Price: ₹1999</p>
        <input type="text" placeholder="Full Name">
        <input type="text" placeholder="Address">
        <input type="text" placeholder="Mobile Number">
        <select>
            <option>Select Payment Method</option>
            <option>UPI</option>
            <option>Credit Card</option>
            <option>Debit Card</option>
            <option>Cash on Delivery</option>
        </select>

        <button onclick="alert('Order Placed Successfully!')">
            Place Order</button>
    </div>
</body>
</html>
